name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    # Uncomment if your app needs Postgres:
    # services:
    #   postgres:
    #     image: postgres:16
    #     env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: app_test }
    #     ports: ["5432:5432"]
    #     options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      ENV: test
      # DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest tests -q
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest e2e -v --video on --output test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-videos, path: test-results/ }
